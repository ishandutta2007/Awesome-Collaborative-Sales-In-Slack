<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Slack / Brand Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36C5F0" />
      <stop offset="33%" stop-color="#2EB67D" />
      <stop offset="66%" stop-color="#ECB22E" />
      <stop offset="100%" stop-color="#E01E5A" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#611f69" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic animations in the background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translateY(0px); }
      50% { opacity: 0.65; transform: scale(1.08) translateY(-8px); }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.85; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(16px) translateX(-14px); opacity: 0.75; }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 0.45; transform: translateY(-4px); }
    }

    .bg-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-1 {
      animation: floatParticle1 6s ease-in-out infinite;
    }
    .particle-2 {
      animation: floatParticle2 7s ease-in-out infinite;
    }
    .animated-wave {
      stroke-dasharray: 8 12;
      animation: waveDash 10s linear infinite;
    }
    .floating-card {
      animation: pulseCard 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Glow Blobs (Behind Everything) -->
  <g class="bg-glow-1">
    <circle cx="200" cy="90" r="140" fill="url(#glowGrad)" filter="url(#glow)" />
    <circle cx="1020" cy="270" r="160" fill="#2EB67D" opacity="0.12" filter="url(#glow)" />
    <circle cx="950" cy="80" r="120" fill="#36C5F0" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Decorative Flow Wave Lines (Background Layer) -->
  <path class="animated-wave" d="M 0,220 Q 300,120 600,220 T 1200,200" fill="none" stroke="#36C5F0" stroke-width="2" opacity="0.25" />
  <path class="animated-wave" d="M 0,260 Q 400,320 800,240 T 1200,280" fill="none" stroke="#E01E5A" stroke-width="1.5" opacity="0.2" />

  <!-- Ambient Dynamic Floating Elements (Safely in background margins) -->
  <g class="particle-1">
    <circle cx="160" cy="290" r="5" fill="#36C5F0" />
    <circle cx="1080" cy="90" r="6" fill="#ECB22E" />
    <circle cx="80" cy="140" r="4" fill="#2EB67D" />
  </g>
  <g class="particle-2">
    <circle cx="1120" cy="210" r="7" fill="#E01E5A" />
    <circle cx="240" cy="50" r="4" fill="#36C5F0" />
    <circle cx="980" cy="310" r="5" fill="#2EB67D" />
  </g>

  <!-- Background Semi-Transparent Workflow Cards (Edges only, no text collision) -->
  <g class="floating-card" opacity="0.3">
    <rect x="50" y="45" width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="70" cy="66" r="6" fill="#2EB67D" />
    <rect x="85" y="62" width="75" height="8" rx="4" fill="#64748b" />

    <rect x="1010" y="140" width="140" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="1032" cy="164" r="6" fill="#36C5F0" />
    <rect x="1048" y="160" width="80" height="8" rx="4" fill="#64748b" />
  </g>

  <!-- Top Accent Spectrum Stripe -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Guaranteed high contrast, clean typography, unblocked by any animations -->

  <!-- Top Category Chip -->
  <g transform="translate(600, 75)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
    <circle cx="-144" cy="0" r="6" fill="#2EB67D" />
    <text x="0" y="5" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ REVENUE OPERATIONS &amp; SLACK CRM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="155" text-anchor="middle" class="title-text">
    Awesome Collaborative Sales In Slack
  </text>

  <!-- Gradient Sub-Bar -->
  <rect x="480" y="178" width="240" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" class="subtitle-text">
    Curated Hub for Pipeline Management, Deal Alerts &amp; Autonomous AI Sales Agents
  </text>

  <!-- Feature Highlights Pills (Foreground) -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: CRM Sync -->
    <g transform="translate(-290, 0)">
      <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#182234" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">💼 Bidirectional CRM Sync</text>
    </g>

    <!-- Pill 2: AI Sales Agents -->
    <g transform="translate(-70, 0)">
      <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#182234" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">🤖 Autonomous AI SDRs</text>
    </g>

    <!-- Pill 3: Deal Alerts -->
    <g transform="translate(150, 0)">
      <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#182234" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">🔔 Real-Time Deal Alerts</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(350, 0)">
      <rect x="-75" y="-17" width="150" height="34" rx="17" fill="#182234" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="badge-text">🚀 Open Source</text>
    </g>
  </g>
</svg>
